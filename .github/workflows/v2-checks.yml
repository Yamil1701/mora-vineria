name: Mora V2 branch checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/mora-v2-app-shell, work/v2-dominio-arquitectura, work/v2-nucleo-local]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/architecture/contract.cases.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Preparar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Verificar recorrido local en navegador
        run: npx playwright test
