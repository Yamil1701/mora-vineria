name: Mora Sites export checks
on:
  pull_request:
    paths:
      - 'sites-next/**'
      - '.github/workflows/sites-next-checks.yml'
permissions:
  contents: read
jobs:
  new-sites-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm test
      - run: npm run test:browser
      - name: Guardar evidencia sintética de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mora-rc-qa
          path: sites-next/artifacts/
          retention-days: 14
