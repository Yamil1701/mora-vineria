name: Publicar Mora Vinería RC2 — desarrollo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites-next
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites-next/package-lock.json
      - name: Instalar dependencias de la nueva Mora
        run: npm ci --no-audit --no-fund
      - name: Verificar el origen RC2
        run: npm run verify
      - name: Ejecutar pruebas de negocio
        run: npm test
      - name: Preparar Chromium para QA de la candidata
        run: npx playwright install --with-deps chromium
      - name: Verificar recorridos de navegador
        run: npm run test:browser
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Publicar exclusivamente la aplicación RC2
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites-next/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar Mora RC2 en la URL principal
        id: deployment
        uses: actions/deploy-pages@v4
